name: Build unsigned iOS marker prototype
on:
  workflow_dispatch:
  push:
    paths:
      - FlameMarkers.mm
      - .github/workflows/build.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Compile arm64 dylib
        run: |
          mkdir -p build
          xcrun --sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=15.0 -std=c++17 -fobjc-arc -dynamiclib FlameMarkers.mm -framework UIKit -framework Foundation -framework QuartzCore -Wl,-install_name,@rpath/FlameMarkers.dylib -o build/FlameMarkers.dylib
      - name: Check architecture and dependencies
        run: |
          lipo -info build/FlameMarkers.dylib
          otool -L build/FlameMarkers.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: FlameMarkers-unsigned
          path: build/FlameMarkers.dylib

