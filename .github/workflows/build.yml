name: Build unsigned iOS marker prototype
on:
  workflow_dispatch:
  push:
    paths:
      - FlameMarkers.mm
      - FlameExtras.hpp
      - FlameMenu.hpp
      - FlameCatalog.hpp
      - FlameOptions.hpp
      - FlamePatch.hpp
      - tests/**
      - .github/workflows/build.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Test grouped restore and speed scaling
        run: |
          mkdir -p build
          clang++ -std=c++17 -fsanitize=address,undefined -fno-omit-frame-pointer tests/PatchTests.cpp -o build/patch-tests
          build/patch-tests
      - name: Compile arm64 dylib
        run: |
          mkdir -p build
          xcrun --sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=15.0 -std=c++17 -fobjc-arc -dynamiclib FlameMarkers.mm -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics -Wl,-install_name,@rpath/FlameMarkers.dylib -o build/FlameMarkers.dylib
      - name: Check architecture and dependencies
        run: |
          lipo -info build/FlameMarkers.dylib
          otool -L build/FlameMarkers.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: FlameMarkers-unsigned
          path: build/FlameMarkers.dylib
  ui_preview:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Render menu in iOS simulator
        run: bash tests/preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlameMenu-UIKit-preview
          path: build/menu-*.png
